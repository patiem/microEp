services:
  resource-db:
    container_name: resource-db
    environment:
      POSTGRES_DB: resource-db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    image: postgres:17-alpine
    ports:
      - "5432:5432"


  song-db:
    container_name: song-db
    environment:
      POSTGRES_DB: song-db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    volumes:
      - ./init-db/init-song.sql:/docker-entrypoint-initdb.d/db.sql

